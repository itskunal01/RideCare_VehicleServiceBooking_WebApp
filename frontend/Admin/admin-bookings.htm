<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin | Booking Management</title>
    <link rel="stylesheet" href="/frontend/css/Admincss/admin-bookings.css">
</head>

<body>

    <!-- SAME NAVBAR AS ADMIN DASHBOARD -->
    <header class="admin-navbar">
        <div class="logo">RideCare Admin</div>
       <nav>
        <a href="/frontend/Admin/admin_dash.html">Dashboard</a>
        <a href="/frontend/Admin/admin-bookings.htm">Bookings</a>
        <a href="/frontend/Admin/admin-services.html">Services</a>
        <a href="/frontend/Admin/admin-packages.html">Packages</a>
        <a href="/frontend/Admin/admin-user.html" class="active">Users</a>
        <a href="admin-login.html" class="logout">Logout</a>
    </nav>
    </header>

    <div class="container">
        <h2>Bookings Management</h2>

        <!-- FILTER BUTTONS -->
        <div class="filters">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="pending">Pending</button>
            <button class="filter-btn" data-filter="accepted">Accepted</button>
            <button class="filter-btn" data-filter="progress">In Progress</button>
            <button class="filter-btn" data-filter="completed">Completed</button>
            <button class="filter-btn" data-filter="rejected">Rejected</button>
        </div>

        <!-- BOOKINGS TABLE -->
        <table>
            <thead>
                <tr>
                    <th>Customer</th>
                    <th>Phone</th>
                    <th>Service / Package</th>
                    <th>Address</th>
                    <th>Date & Time</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>

            <tbody id="bookingTableBody">

                <!-- SAMPLE ROW (You will replace this dynamically later) -->
                <tr class="booking-row">
                    <td>Rahul Sharma</td>
                    <td>9876543210</td>
                    <td>Full Service Package</td>
                    <td>Mumbai, Andheri East</td>
                    <td>2025-02-10 | 11:00 AM</td>

                    <td class="status status-pending" data-status="pending">Pending</td>

                    <td class="actions">
                        <button class="accept-btn">Accept</button>
                        <button class="reject-btn">Reject</button>

                        <select class="status-dropdown">
                            <option value="none">Update Status</option>
                            <option value="pending">Pending</option>
                            <option value="accepted">Accepted</option>
                            <option value="progress">In Progress</option>
                            <option value="completed">Completed</option>
                        </select>
                    </td>
                </tr>

            </tbody>
        </table>
    </div>

    <script src="/frontend/adminjs/admin-booking.js"></script>
</body>
</html>
