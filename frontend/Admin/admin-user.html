<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — Manage Users</title>
  <link rel="stylesheet" href="/frontend/css/Admincss/admin-users.css">
</head>
<body>

<!-- 🔵 Admin Navbar -->
<header class="admin-navbar">
    <h2 class="logo">RideCare Admin</h2>
    <nav>
        <a href="/frontend/Admin/admin_dash.html">Dashboard</a>
        <a href="/frontend/Admin/admin-bookings.htm">Bookings</a>
        <a href="/frontend/Admin/admin-services.html">Services</a>
        <a href="/frontend/Admin/admin-packages.html">Packages</a>
        <a href="/frontend/Admin/admin-user.html" class="active">Users</a>
        <a href="admin-login.html" class="logout">Logout</a>
    </nav>
</header>

<main class="container">

    <h1>Manage Users</h1>

    <!-- 🔎 Filters -->
    <div class="filters">
        <select id="statusFilter">
            <option value="all">All Users</option>
            <option value="active">Active</option>
            <option value="blocked">Blocked</option>
        </select>

        <input type="text" id="searchUser" placeholder="Search by name or phone…">
    </div>

    <!-- 🧑 Users Table -->
    <table class="users-table">
        <thead>
            <tr>
                <th>Name</th>
                <th>Phone</th>
                <th>Total Bookings</th>
                <th>Last Service</th>
                <th>Next Service</th>
                <th>Status</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="usersBody">
            <!-- Dynamic rows by JS -->
        </tbody>
    </table>

</main>

<!-- 📌 User Details Popup -->
<div id="userModal" class="modal hidden">
    <div class="modal-content">
        <span id="closeModal" class="close">&times;</span>
        <h2>User Details</h2>

        <div id="modalDetails"></div>
    </div>
</div>

<script src="/frontend/adminjs/admin-users.js"></script>
</body>
</html>
